name: Release Builds

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build - ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Linux x86_64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            asset_name: torcrypt-linux-x86_64
            bin_source: target/x86_64-unknown-linux-gnu/release/torcrypt-tui
          # Linux aarch64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            asset_name: torcrypt-linux-aarch64
            bin_source: target/aarch64-unknown-linux-gnu/release/torcrypt-tui
          # macOS x86_64
          - target: x86_64-apple-darwin
            os: macos-latest
            asset_name: torcrypt-macos-x86_64
            bin_source: target/x86_64-apple-darwin/release/torcrypt-tui
          # macOS Apple Silicon (M1/M2/M3)
          - target: aarch64-apple-darwin
            os: macos-latest
            asset_name: torcrypt-macos-aarch64
            bin_source: target/aarch64-apple-darwin/release/torcrypt-tui
          # Windows x86_64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            asset_name: torcrypt-windows-x86_64.exe
            bin_source: target/x86_64-pc-windows-msvc/release/torcrypt-tui.exe

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install aarch64 cross-compilation tools (if Linux ARM)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Compile Release Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage Release Artifact (POSIX)
        if: runner.os != 'Windows'
        run: cp ${{ matrix.bin_source }} ${{ matrix.asset_name }}

      - name: Stage Release Artifact (Windows)
        if: runner.os == 'Windows'
        run: copy ${{ matrix.bin_source }} ${{ matrix.asset_name }}

      - name: Publish Artifact to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.asset_name }}
          generate_release_notes: true
