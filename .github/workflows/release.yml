name: Release Builds

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build - ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            asset_name: torcrypt-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            asset_name: torcrypt-linux-aarch64
          - target: x86_64-apple-darwin
            os: macos-latest
            asset_name: torcrypt-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            asset_name: torcrypt-macos-aarch64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install aarch64 cross-compilation tools (if Linux ARM)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Compile Release Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage Release Artifact
        run: cp target/${{ matrix.target }}/release/torcrypt-tui ${{ matrix.asset_name }}

      - name: Publish Artifact to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.asset_name }}
          generate_release_notes: true
