name: Release Builds

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build - ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 Static (Zero Glibc Dependency — 100% Portable)
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            asset_name: torcrypt-linux-x86_64
            bin_source: target/x86_64-unknown-linux-musl/release/torcrypt-tui

          # Linux x86_64 Glibc Fallback
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            asset_name: torcrypt-linux-x86_64-gnu
            bin_source: target/x86_64-unknown-linux-gnu/release/torcrypt-tui

          # macOS Intel (x86_64)
          - target: x86_64-apple-darwin
            os: macos-latest
            asset_name: torcrypt-macos-x86_64
            bin_source: target/x86_64-apple-darwin/release/torcrypt-tui

          # macOS Apple Silicon (M1/M2/M3)
          - target: aarch64-apple-darwin
            os: macos-latest
            asset_name: torcrypt-macos-aarch64
            bin_source: target/aarch64-apple-darwin/release/torcrypt-tui

          # Windows x86_64 (MSVC Native)
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            asset_name: torcrypt-windows-x86_64.exe
            bin_source: target/x86_64-pc-windows-msvc/release/torcrypt-tui.exe

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Musl Tools (Linux)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Compile Release Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage Release Artifact (POSIX)
        if: runner.os != 'Windows'
        run: cp ${{ matrix.bin_source }} ${{ matrix.asset_name }}

      - name: Stage Release Artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item "${{ matrix.bin_source }}" -Destination "${{ matrix.asset_name }}" -Force

      - name: Publish Artifact to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.asset_name }}
          generate_release_notes: true
